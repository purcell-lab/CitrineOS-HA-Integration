start_charging:
  name: Start charging
  description: Start a remote charging transaction on a station.
  fields:
    entry_id:
      required: false
      example: abcdef123456
      selector:
        text:
    station_id:
      required: true
      example: liam
      selector:
        text:
    protocol:
      required: false
      example: ocpp2.0.1
      selector:
        text:
    id_tag:
      required: false
      example: HA_REMOTE
      selector:
        text:
    evse_id:
      required: false
      example: 1
      selector:
        number:
          min: 0
          max: 999

stop_charging:
  name: Stop charging
  description: Stop a remote charging transaction on a station.
  fields:
    entry_id:
      required: false
      selector:
        text:
    station_id:
      required: true
      example: liam
      selector:
        text:
    protocol:
      required: false
      example: ocpp2.0.1
      selector:
        text:
    transaction_id:
      required: false
      example: tx-123
      selector:
        text:

set_station_limit:
  name: Set station limit
  description: Apply a station-level smart charging limit.
  fields:
    entry_id:
      required: false
      selector:
        text:
    station_id:
      required: true
      example: liam
      selector:
        text:
    protocol:
      required: false
      selector:
        text:
    limit:
      required: true
      example: 12000
      selector:
        number:
          min: 0
          max: 500000
    unit:
      required: false
      example: W
      selector:
        select:
          options:
            - W
            - A
    evse_id:
      required: false
      selector:
        number:
          min: 0
          max: 999
    duration:
      required: false
      selector:
        number:
          min: 0
          max: 86400

set_group_limit:
  name: Set group limit
  description: Apply a group cap and split equally across member stations.
  fields:
    entry_id:
      required: false
      selector:
        text:
    group_id:
      required: true
      selector:
        text:
    station_ids:
      required: true
      selector:
        object:
    limit:
      required: true
      selector:
        number:
          min: -500000
          max: 500000
    unit:
      required: false
      selector:
        select:
          options:
            - W
            - A
    duration:
      required: false
      selector:
        number:
          min: 0
          max: 86400

set_charging_profile:
  name: Set charging profile
  description: Set an explicit charging profile, adapting payload shape to each station OCPP version.
  fields:
    entry_id:
      required: false
      selector:
        text:
    station_id:
      required: true
      selector:
        text:
    protocol:
      required: false
      example: ocpp2.0.1
      selector:
        text:
    limit:
      required: true
      selector:
        number:
          min: -500000
          max: 500000
    setpoint:
      required: false
      selector:
        number:
          min: -500000
          max: 500000
    discharge_limit:
      required: false
      selector:
        number:
          min: 0
          max: 500000
    operation_mode:
      required: false
      selector:
        select:
          options:
            - ChargingOnly
            - ChargingAndDischarging
            - DischargingOnly
    unit:
      required: false
      selector:
        select:
          options:
            - W
            - A
    evse_id:
      required: false
      selector:
        number:
          min: 0
          max: 999
    duration:
      required: false
      selector:
        number:
          min: 0
          max: 86400
    transaction_id:
      required: false
      selector:
        text:
    stack_level:
      required: false
      selector:
        number:
          min: 0
          max: 999
    profile_id:
      required: false
      selector:
        number:
          min: 1
          max: 999999
    profile_purpose:
      required: false
      example: TxProfile
      selector:
        text:
    profile_kind:
      required: false
      example: Absolute
      selector:
        select:
          options:
            - Absolute
            - Relative
            - Dynamic
    profile_periods:
      required: false
      selector:
        object:

clear_charging_profile:
  name: Clear charging profile
  description: Clear one or more charging profiles using OCPP-version aware criteria.
  fields:
    entry_id:
      required: false
      selector:
        text:
    station_id:
      required: true
      selector:
        text:
    protocol:
      required: false
      selector:
        text:
    evse_id:
      required: false
      selector:
        number:
          min: 0
          max: 999
    stack_level:
      required: false
      selector:
        number:
          min: 0
          max: 999
    profile_id:
      required: false
      selector:
        number:
          min: 1
          max: 999999
    profile_purpose:
      required: false
      example: TxProfile
      selector:
        text:

sync_discovery_now:
  name: Sync discovery
  description: Trigger an immediate Hasura discovery refresh.
  fields:
    entry_id:
      required: false
      selector:
        text:

sync_ems_telemetry_now:
  name: Sync EMS telemetry
  description: Trigger an immediate EMS intake telemetry refresh from Citrine Data API.
  fields:
    entry_id:
      required: false
      selector:
        text:
    site_id:
      required: false
      description: Optional site override for telemetry scope. If omitted, integration option scope is used.
      selector:
        text:
    telemetry_limit:
      required: false
      description: Optional limit override for telemetry summary rows. If omitted, integration option limit is used.
      selector:
        number:
          min: 1
          max: 2000

clear_ems_telemetry_error:
  name: Clear EMS telemetry error
  description: Clear the cached telemetry error state when a transient API failure has already recovered.
  fields:
    entry_id:
      required: false
      selector:
        text:

set_controller_mode:
  name: Set controller mode
  description: Change operating mode for the local energy load controller.
  fields:
    entry_id:
      required: false
      selector:
        text:
    controller_mode:
      required: true
      example: Solar Only
      selector:
        select:
          options:
            - "Off"
            - "Solar Only"
            - "Solar + Battery"
            - "Grid Capped (Fast)"
            - "Dynamic Envelope (DOE)"
            - "Emergency Safe"

recompute_load_control:
  name: Recompute load control
  description: Force an immediate load controller calculation cycle and push limits to CitrineOS.
  fields:
    entry_id:
      required: false
      selector:
        text:

emergency_safe_mode:
  name: Emergency safe mode
  description: Immediately clamp all active EV chargers to safe minimal/zero power.
  fields:
    entry_id:
      required: false
      selector:
        text:
lab_schedule:
  name: Submit scoped lab schedule
  description: Send one bounded OCPP 2.1 schedule to the currently active EVerest lab transaction. W only, 600 seconds maximum, no fallback or retry. Periods are V2G CentralSetpoint periods or AC charging-only limits (optional numberPhases 1 or 3). immediate starts the schedule now, so a replacement leaves no unlimited gap.
  fields:
    entry_id:
      required: true
      selector:
        text:
    periods:
      required: true
      selector:
        object:
    duration:
      default: 240
      selector:
        number:
          min: 1
          max: 600
          unit_of_measurement: s
    immediate:
      default: false
      selector:
        boolean:
    price_entity:
      required: false
      selector:
        entity:
          domain: sensor

lab_cost_update:
  name: Send scoped lab cost update
  description: Send CostUpdated with California Pricing customData (current Amber price, the next interval and a price text) for the command station's active transaction. OCPP 2.1 and 2.0.1; needs price commands enabled in the CitrineOS App. Information only; returns what was sent and the dispatch state.
  fields:
    entry_id:
      required: true
      selector:
        text:
    price_entity:
      required: true
      selector:
        entity:
          domain: sensor
    total_cost:
      default: 0
      selector:
        number:
          min: 0
          max: 10000
          step: 0.01
          mode: box

lab_default_tariff:
  name: Send scoped lab default tariff
  description: Send SetDefaultTariff (OCPP 2.1) built from the Amber forecast, AUD/kWh excluding GST with a GST 10 % tax rate, local times of day. Optional feed-in prices become export entries the station pays. Only stations listed in the App's tariff_stations; returns the station's status (Accepted, Rejected, CALLERROR NotImplemented ...).
  fields:
    entry_id:
      required: true
      selector:
        text:
    price_entity:
      required: true
      selector:
        entity:
          domain: sensor
    export_price_entity:
      required: false
      selector:
        entity:
          domain: sensor
    station_id:
      required: false
      selector:
        text:
    evse_id:
      default: 0
      selector:
        number:
          min: 0
          max: 10
          mode: box
    intervals:
      default: 48
      selector:
        number:
          min: 1
          max: 288
          mode: box

lab_reconcile:
  name: Reconcile scoped lab command state
  description: Re-read the CSMS (readiness, command policy and the command station's active transaction) and resolve an outcome_unknown, dispatch_not_confirmed or awaiting-evidence command without reloading the integration. A command sent less than 90 seconds ago may still land and is never cleared; the call fails with the remaining wait instead. Returns the resolved command state.
  fields:
    entry_id:
      required: true
      selector:
        text:
