name: Client compatibility and read-only safety
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install homeassistant==2026.10.0 pytest==8.4.2 pytest-asyncio==1.2.0
      - run: python -m pytest tests -q
      - run: python -m compileall -q custom_components
      - run: git -c core.whitespace=cr-at-eol diff --check
